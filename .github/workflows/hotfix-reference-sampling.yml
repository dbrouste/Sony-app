name: Hotfix reference sampling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-reference-sampling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reference sampling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text(encoding='utf-8')
          old = """          if (completedBin.length >= 3) {
            const consolidated = medianTimedPoint(completedBin);
"""
          new = """          if (completedBin.length >= 1) {
            const consolidated = medianTimedPoint(completedBin);
"""
          if old not in text:
              raise SystemExit('Expected reference sampling block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/hotfix-reference-sampling.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix drift reference sampling at low tracking rates"
          git push origin HEAD:main
