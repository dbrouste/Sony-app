name: Fix reference timing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-reference-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted patch
        run: python scripts/fix-reference-timing.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix drift reference timing across slow tracking frames"
          git push origin HEAD:main
