plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.astrometry'
version = '0.1.0'

android {
  namespace "expo.modules.astrometry"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"

    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a'
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_static"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  lintOptions {
    abortOnError false
  }
}
